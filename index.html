<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Emoji Food & Habit Calendar</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #4f46e5;
      --primary-soft: #eef2ff;
      --danger: #ef4444;
      --today-ring: #4f46e5;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
    }

    .app-container {
      width: 100%;
      max-width: 540px;
      background: var(--surface);
      border-radius: 18px;
      box-shadow: 0 4px 20px rgba(15, 23, 42, 0.06);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    .header {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: var(--surface);
    }

    .month-nav {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-btn {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-btn:active {
      background: var(--border);
    }

    .month-title {
      font-size: 1.05rem;
      font-weight: 700;
      min-width: 135px;
      text-align: center;
    }

    .legend-btn {
      padding: 8px 12px;
      border-radius: 10px;
      border: none;
      background: var(--primary-soft);
      color: var(--primary);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .legend-btn:active {
      opacity: 0.8;
    }

    /* Calendar Grid */
    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: #f1f5f9;
      border-bottom: 1px solid var(--border);
      padding: 6px 0;
    }

    .weekday {
      text-align: center;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: var(--border);
      gap: 1px;
    }

    .day-cell {
      background: var(--surface);
      min-height: 78px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: background 0.12s;
      overflow: hidden;
    }

    .day-cell:active {
      background: #f1f5f9;
    }

    .day-cell.empty {
      background: #f8fafc;
      cursor: default;
    }

    .day-number {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--muted);
      margin-bottom: 3px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      border-radius: 50%;
    }

    .day-cell.today .day-number {
      background: var(--today-ring);
      color: #ffffff;
    }

    /* Compact emoji container sized for up to 15 mini emojis */
    .emoji-box {
      display: flex;
      flex-wrap: wrap;
      align-content: flex-start;
      gap: 1px;
      line-height: 1;
    }

    .mini-emoji {
      font-size: 11px;
      width: 13px;
      height: 13px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .more-badge {
      font-size: 9px;
      font-weight: 700;
      color: var(--primary);
      background: var(--primary-soft);
      border-radius: 4px;
      padding: 0 3px;
      height: 13px;
      display: inline-flex;
      align-items: center;
    }

    /* Modal Backdrop */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
      padding: 12px;
    }

    @media (min-width: 520px) {
      .modal-backdrop {
        align-items: center;
      }
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: var(--surface);
      width: 100%;
      max-width: 440px;
      max-height: 85vh;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.2);
      animation: slideUp 0.18s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .close-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: var(--bg);
      color: var(--muted);
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .modal-body {
      padding: 16px 18px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .section-label {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    /* Logged Items List in Day Popup */
    .logged-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .logged-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    .logged-item-info {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .logged-item-emoji {
      font-size: 1.35rem;
    }

    .remove-btn {
      border: none;
      background: #fee2e2;
      color: var(--danger);
      font-size: 0.78rem;
      font-weight: 600;
      padding: 5px 9px;
      border-radius: 8px;
      cursor: pointer;
    }

    .empty-state {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      padding: 14px;
      background: var(--bg);
      border-radius: 12px;
      border: 1px dashed var(--border);
    }

    /* Quick-Add Grid in Day Popup */
    .quick-add-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .quick-chip {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--surface);
      cursor: pointer;
      text-align: left;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text);
    }

    .quick-chip:active {
      background: var(--primary-soft);
      border-color: var(--primary);
    }

    .quick-chip span.e {
      font-size: 1.25rem;
    }

    .quick-chip span.m {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .add-legend-form {
      display: flex;
      gap
